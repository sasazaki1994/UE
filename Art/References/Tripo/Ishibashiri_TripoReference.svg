<text class="t xs" x="20" y="590">注連縄・紙垂は局所。祭祀物を全身に過剰装飾しない。</text></g>
<g transform="translate(50,780)"><text class="t s">TRIPO LOCKS</text>
<text class="t xs" x="0" y="34">・約12m級の巨大猪。重量感のある低重心　・背中は岩山/苔/根が融合　・皮膚、剛毛、岩盤が一体化しすぎず素材差を残す</text>
<text class="t xs" x="0" y="63">・3禍根は肩〜背中〜後方の登攀終点として視認可能　・11 Routeの足場を塞がない　・脚/肩/背中のGrab面を滑らかに潰さない</text>
<text class="t xs" x="0" y="92">・Calm後も死亡/崩壊/消滅させない　・怪獣的な角/ドラゴン要素/金属装甲は禁止　・自然と獣が共生した古い山の主として作る</text>
<text class="t xs" x="0" y="132">Pipeline: Tripo AI mesh → Blender scale/topology/rig → preserve anchors → UE5 regression → High Quality review</text></g>
</svg>