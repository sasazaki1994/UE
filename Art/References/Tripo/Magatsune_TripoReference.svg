<g transform="translate(50,780)"><text class="t s">TRIPO LOCKS</text><text class="t xs" x="0" y="34">・生物の顔、目、口、手足を作らない　・Root Aの脈動、Phase2の根/岩柱往復、Final Riseの傾斜が読める構成</text><text class="t xs" x="0" y="65">・3禍根: 地表根終端 / Root B終端 / 中央核　・Calm後は爆発・消滅せず、角度と高さが落ち着いて静止する</text><text class="t xs" x="0" y="98">・Tripoは根、岩柱、腐食樹木、中央核など部品生成にも使用可。Gameplay Root transformとRouteは既存実装を基準に組み直す。</text><text class="t xs" x="0" y="132">Pipeline: Tripo component meshes → Blender cleanup → UE5 assembly around existing route/safe-point transforms</text></g></svg>