<text x="50" y="58" class="t h">白面の祓い手 — Tripo AI 3D Reference</text>
<text x="50" y="90" class="t s">目的: 本番3D生成の外形・素材・左右差を固定。既存Skeleton / Grab / Climbing契約へ後段で合わせる。</text>
