<rect x="278" y="90" width="34" height="34" fill="#eee9db"/><text class="t xs" x="320" y="114">面: 汚れた白木</text>
<rect x="278" y="137" width="34" height="34" fill="#252b35"/><text class="t xs" x="320" y="161">衣: 墨/濃紺 布</text>
<rect x="278" y="184" width="34" height="34" fill="#7b1d24"/><text class="t xs" x="320" y="208">穢れ: 赤黒</text>
<rect x="278" y="231" width="34" height="34" fill="#9d815a"/><text class="t xs" x="320" y="255">縄/札: 枯色</text>
<text class="t xs" x="20" y="590">境断ち: 長身・細身。過剰な西洋装飾は避ける</text>
</g>
<g transform="translate(50,780)"><text class="t s" x="0" y="0">TRIPO LOCKS</text>
<text class="t xs" x="0" y="34">・成人男性、細身で山仕事に耐える実用体型　・顔は常時「白面」で隠す　・左腕のみ枝状/亀裂状の穢れ　・右手/身体は人間のまま</text>
<text class="t xs" x="0" y="63">・衣装は和風ファンタジーだが武士鎧ではなく山の作業着/祓い装束寄り　・境断ちは長い祭祀刀　・腰縄、札、小さな鈴を残す</text>
<text class="t xs" x="0" y="92">・左右対称化しない　・巨大肩当て、派手な金属鎧、現代装備、SF意匠は禁止　・T/A pose化は後工程で実施可</text>
<text class="t xs" x="0" y="132">Pipeline: ChatGPT reference → Tripo AI → Blender cleanup/rig/weights → UE5 import → gameplay regression → High Quality review</text>
</g>
</svg>