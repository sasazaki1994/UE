<text x="50" y="58" class="t h">淵纏い — Tripo AI 3D Reference</text><text x="50" y="90" class="t s">巨大な渓谷大蛇。噛みつき → 岩へ誘導 → 頭部Grab → 巻き付き → 3禍根のGameplayをVisualより優先。</text>
