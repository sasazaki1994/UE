<text class="t xs" x="32" y="405">・全長感は長大。ドラゴンの手足・翼・角は禁止。</text><text class="t xs" x="32" y="438">・頭部はGrabできる平滑な面を残し、牙で入口を塞がない。</text><text class="t xs" x="32" y="471">・Coiling時、胴体が岩棚/岩柱の足場として読める太さを維持。</text><text class="t xs" x="32" y="504">・禍根1=首〜上胴、2=巻き付き胴、3=高所頭頂。</text><text class="t xs" x="32" y="537">・Calm後は死体化せず、水と岩に馴染む静かな生体として残す。</text><text class="t xs" x="32" y="585">Tripo → Blender rig/curve cleanup → preserve route anchors → UE5</text></g>
<g transform="translate(50,780)"><text class="t s">VISUAL DIRECTION</text><text class="t xs" x="0" y="34">古い淵に棲む水蛇。濡れた鱗、苔、泥、擦れた岩粉。派手な発光は禍根だけに制限し、全身を魔法生物化しない。</text><text class="t xs" x="0" y="66">噛みつき時の口・頭部シルエット、頭部Grab面、身体と岩の往復ルートの可読性を最優先。</text></g></svg>