<text class="t xs" x="28" y="485">・ゴリラより山猿寄り。巨大だが過度に筋肉怪獣化しない。</text><text class="t xs" x="28" y="516">・長い腕、強い指、崖への接地面を明確に。</text><text class="t xs" x="28" y="547">・腕橋としてプレイヤーが乗れる幅を残す。</text><text class="t xs" x="28" y="578">・金属鎧、武器、人工装備は禁止。</text></g>
<g transform="translate(50,780)"><text class="t s">TRIPO LOCKS</text><text class="t xs" x="0" y="34">・Phase1の左脚〜背中、Phase2の左腕橋、Phase3の反対肩〜首〜頭頂のシルエットを保持。14 Route概念点を塞がない。</text><text class="t xs" x="0" y="66">・身体変形は伸びるゴム腕ではなく、巨大な関節と体重移動で崖へ腕を掛け直す印象。Calmでは静かな山の主へ戻る。</text><text class="t xs" x="0" y="102">Pipeline: Tripo AI base → Blender joint/rig correction → anchor preservation → UE5 Cling/Recovery regression</text></g></svg>