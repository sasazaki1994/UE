name: Narrative source contracts
on:
  pull_request:
    paths: ['Docs/Design/**', 'Source/**', 'Tools/ValidateNarrativeContracts.py', 'Tests/test_narrative_contracts.py', '.github/workflows/narrative-contracts.yml']
  push:
    paths: ['Docs/Design/**', 'Source/**', 'Tools/ValidateNarrativeContracts.py', 'Tests/test_narrative_contracts.py', '.github/workflows/narrative-contracts.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python Tools/ValidateNarrativeContracts.py
      - run: python -m unittest discover -s Tests -p 'test_narrative_contracts.py' -v
